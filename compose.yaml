
services:
  postgres:
    image: postgres:16-alpine
    container_name: alphahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphahub
      POSTGRES_PASSWORD: alphahub_dev_local
      POSTGRES_DB: alphahub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphahub -d alphahub"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://alphahub:alphahub_dev_local@postgres:5432/alphahub?sslmode=disable
    command: ["up"]

volumes:
  postgres_data:
