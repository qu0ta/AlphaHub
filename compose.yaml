
services:
  postgres:
    image: postgres:16-alpine
    container_name: alphahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphahub
      POSTGRES_PASSWORD: alphahub_dev_local
      POSTGRES_DB: alphahub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphahub -d alphahub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
